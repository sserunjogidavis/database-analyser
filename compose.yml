services:
  postgres:
    image: postgres:16
    container_name: database-analyser-postgres

    environment:
      POSTGRES_DB: companydb
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U analyst -d companydb"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - database_analyser_postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro

volumes:
  database_analyser_postgres_data:
