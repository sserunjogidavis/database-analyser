name: Database Analyser CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: companydb
          POSTGRES_USER: analyst
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analyst -d companydb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: companydb
      DB_USER: analyst
      DB_PASSWORD: ci-test-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Initialize development database
        env:
          PGPASSWORD: ci-test-password
        run: |
          psql \
            -h localhost \
            -U analyst \
            -d companydb \
            -f docker/init/01-base-schema.sql

      - name: Run clean test suite
        run: ./gradlew clean test

      - name: Run complete verification gate
        run: ./gradlew check
